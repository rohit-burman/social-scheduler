[project]
name = "social-scheduler-api"
version = "0.1.0"
description = "FastAPI backend for Social Scheduler"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0,<0.116.0",
    "pwdlib[argon2]>=0.3.0",
    "pydantic-settings>=2.6.0",
    "pydantic[email]>=2.9.0",
    "pyjwt>=2.8.0",
    "pymongo>=4.10.0",
    "python-multipart>=0.0.9",
    "redis>=4.6.0",
    "uvicorn>=0.30.0",
]
