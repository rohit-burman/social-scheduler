[project]
name = "social-scheduler-worker"
version = "0.1.0"
description = "Worker process for scheduled publish jobs"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "redis>=5.1.0",
  "pydantic>=2.9.0",
  "pydantic-settings>=2.5.0",
  "motor>=3.6.0",
  "httpx>=0.27.2"
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3.3",
  "pytest-asyncio>=0.24.0",
  "ruff>=0.6.9"
]

[tool.ruff]
line-length = 100
target-version = "py312"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
