[project]
name = "social-scheduler-worker"
version = "0.1.0"
description = "Worker process for scheduled publish jobs"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "pymongo>=4.17.0",
  "pydantic-settings>=2.5.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]