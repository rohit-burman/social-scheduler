version: '3.8'

services:
  mongodb:
    image: mongo:7.0
    container_name: social-scheduler-mongodb
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    restart: unless-stopped

  redis:
    image: redis:7.0-alpine
    container_name: social-scheduler-redis
    ports:
      - "6379:6379"
    restart: unless-stopped

  api:
    build:
      context: ./apps/api
      dockerfile: Dockerfile
    container_name: social-scheduler-api
    ports:
      - "8000:8000"
    environment:
      - MONGODB_URL=mongodb://mongodb:27017/social_schedular
      - REDIS_URL=redis://redis:6379/0
      - JWT_SECRET=${JWT_SECRET:-replace-me-with-a-secure-random-string}
    depends_on:
      - mongodb
      - redis
    restart: unless-stopped

  worker:
    build:
      context: ./apps/worker
      dockerfile: Dockerfile
    container_name: social-scheduler-worker
    environment:
      - MONGODB_URL=mongodb://mongodb:27017/social_schedular
    depends_on:
      - mongodb
    restart: unless-stopped

  web:
    build:
      context: ./apps/web
      dockerfile: Dockerfile
    container_name: social-scheduler-web
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_BASE_URL=http://localhost:8000
    depends_on:
      - api
    restart: unless-stopped

volumes:
  mongodb_data: