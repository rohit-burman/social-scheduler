apiVersion: apps/v1
kind: Deployment
metadata:
  name: social-scheduler-api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: social-scheduler-api
  template:
    metadata:
      labels:
        app: social-scheduler-api
    spec:
      containers:
        - name: api
          image: your-registry/social-scheduler-api:latest
          ports:
            - containerPort: 8000
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: social-scheduler-api
spec:
  selector:
    app: social-scheduler-api
  ports:
    - protocol: TCP
      port: 80
      targetPort: 8000
